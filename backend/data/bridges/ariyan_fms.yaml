name: ariyan_fms_bridge
topics:
  odom:
    type: nav_msgs/msg/Odometry
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/odom
  scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/scan
  amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/amcl_pose
  battery_state:
    type: sensor_msgs/msg/BatteryState
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/battery_state
  navigation_status:
    type: std_msgs/msg/String
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/navigation_status
  tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/tf
  tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/tf_static
  map:
    type: nav_msgs/msg/OccupancyGrid
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/map
  ariyan_fms/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 0
    to_domain: 12
    remap: /cmd_vel
  ariyan_fms/goal_request:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 12
    remap: /goal_request
  ariyan_fms/goal_cancel:
    type: std_msgs/msg/Bool
    from_domain: 0
    to_domain: 12
    remap: /goal_cancel
  ariyan_fms/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 0
    to_domain: 12
    remap: /initialpose
  ariyan_fms/emergency_stop:
    type: std_msgs/msg/Bool
    from_domain: 0
    to_domain: 12
    remap: /emergency_stop
  ariyan_fms/dock_command:
    type: std_msgs/msg/String
    from_domain: 0
    to_domain: 12
    remap: /dock_command
  dock_state:
    type: std_msgs/msg/String
    from_domain: 12
    to_domain: 0
    remap: /ariyan_fms/dock_state
