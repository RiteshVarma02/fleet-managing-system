version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://swarm:swarm@db:5432/swarm
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      ROS_ENABLED: "true"
      ROS_DOMAIN_ID: "0"
    # ROS 2 DDS discovery needs the host network.
    network_mode: host
    volumes:
      - ./maps:/srv/app/maps
      - ./data:/srv/app/data

volumes:
  pgdata:
