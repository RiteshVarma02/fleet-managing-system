services:
  mongo:
    image: mongo:7
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: fleet_management
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Host networking so the API (also host-networked for DDS) can reach it.
    network_mode: host

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_OPERATOR_PASSWORD: ${BOOTSTRAP_OPERATOR_PASSWORD:?set BOOTSTRAP_OPERATOR_PASSWORD}
      MONGO_MODE: local
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB_NAME: fleet_management
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      ROS_ENABLED: "true"
      ROS_DOMAIN_ID: "0"
      DOMAIN_BRIDGE_ENABLED: "true"
      AUTOSTART_ROBOT_CONTROLLERS: "true"
    # ROS 2 DDS discovery and domain_bridge both need the host network.
    network_mode: host
    volumes:
      - ./maps:/srv/app/maps
      - ./data:/srv/app/data

volumes:
  mongodata:
